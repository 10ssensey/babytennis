<style>
:root{--lime:#CDEB45;--lime-deep:#B6D633;--lime-soft:#EEF8BF;--green:#14A05A;--green-deep:#0E7B44;--green-soft:#D9F4E4;--clay:#ED7A3C;--blue:#2F8FD6;--sun:#FFC53A;--canvas:#FFF7E8;--soft:#FFEBCF;--card:#fff;--strong:#FFE0B8;--hair:#F3E0BF;--hair2:#E6CE9F;--ink:#2A3A2F;--body:#5A6358;--muted:#756E5A;--on-lime:#1B3409;--tagc:#0E7B44;--sh:0 10px 26px rgba(120,80,20,.12);--ease:cubic-bezier(.34,1.56,.64,1);--fd:'Fredoka','Nunito',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#1F2347;--soft:#292E5C;--card:#313769;--strong:#3C4380;--hair:#444C8C;--hair2:#5862A8;--ink:#FFF7E8;--body:#DADDF3;--muted:#AEB3E0;--green-soft:#235A55;--lime-soft:#3B4786;--green:#1FAE6B;--tagc:#CDEB45;--sh:0 10px 26px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#1F2347;--soft:#292E5C;--card:#313769;--strong:#3C4380;--hair:#444C8C;--hair2:#5862A8;--ink:#FFF7E8;--body:#DADDF3;--muted:#AEB3E0;--green-soft:#235A55;--lime-soft:#3B4786;--green:#1FAE6B;--tagc:#CDEB45;--sh:0 10px 26px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;height:100%;scroll-padding-top:calc(120px + env(safe-area-inset-top,0px))}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--fb);background:var(--canvas);color:var(--body);-webkit-font-smoothing:antialiased;line-height:1.55}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
svg.b{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border-radius:16px;padding:13px 24px;min-height:48px;text-align:center;transition:transform .2s var(--ease),background .2s}

.lime{background:var(--lime);color:var(--on-lime);box-shadow:0 10px 24px rgba(150,190,40,.35)}.lime:hover{background:var(--lime-deep)}

.line{border:1.5px solid var(--hair2);color:var(--ink)}.line:hover{border-color:var(--ink)}
.block{width:100%}
h1,h2,h3{font-family:var(--fd);font-weight:600;color:var(--ink)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.lang{background:var(--lime);color:var(--on-lime)}
.lang .wrap{display:flex;justify-content:flex-end;align-items:center;gap:6px;height:38px}
.lang button{font-size:13.5px;font-weight:700;padding:5px 12px;border-radius:999px;color:inherit;opacity:.75;min-height:28px}
.lang button:hover{opacity:1}.lang button[aria-pressed="true"]{background:#fff;color:var(--on-lime);opacity:1;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.nav{height:66px;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:600;font-size:23px;letter-spacing:-.5px;color:var(--ink)}.logo i{font-style:normal;color:var(--green)}
.links{display:flex;gap:4px;margin-left:8px}.links a{font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;white-space:nowrap}.links a:hover{background:var(--strong)}
.nav .btn{margin-left:auto;min-height:42px;padding:9px 18px;font-size:15px}
.hero{padding:56px 0 72px;background:linear-gradient(180deg,var(--soft),var(--canvas))}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--tagc);background:var(--green-soft);padding:7px 14px;border-radius:999px}
.hero h1{font-size:clamp(36px,5.6vw,58px);line-height:1.05;letter-spacing:-1.2px;margin:20px 0 16px}
.lead{font-size:19px;max-width:480px}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.pts{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:26px;font-weight:700;font-size:14.5px;color:var(--ink)}
.pts span{display:flex;align-items:center;gap:8px}.pts svg{color:var(--green)}
.vis{position:relative;background:var(--lime-soft);border-radius:36px;aspect-ratio:1/1.05;overflow:hidden}
.vis .b1{position:absolute;right:-50px;top:-50px;width:230px}.vis .b2{position:absolute;left:24px;bottom:30px;width:84px}
.days{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:1fr;gap:14px}
.day{background:var(--card);border-radius:28px;padding:36px 26px;text-align:center;box-shadow:var(--sh)}

.sec{padding:80px 0}.alt{background:var(--soft)}

.progs{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.prog{border-radius:28px;padding:30px;position:relative;overflow:hidden;min-height:220px}
.prog h3{font-size:36px;letter-spacing:-.8px;margin-bottom:10px;color:inherit}

.prog.w{color:#fff}.prog.d{color:#14271C}
.prog::after{content:'';position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18)}
.price{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;max-width:860px;margin:0 auto;align-items:stretch}
.tier{background:var(--card);border:1px solid var(--hair);border-radius:28px;padding:34px;display:flex;flex-direction:column}
.tier.f{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 10px 24px rgba(20,160,90,.3)}
.tier .n{font-weight:800;font-size:15px;color:var(--muted)}.tier.f .n{color:var(--lime)}

.tier.f .p{color:#fff}

.badge{align-self:flex-start;background:var(--lime);color:var(--on-lime);font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;margin-bottom:14px}
.note{text-align:center;margin:26px auto 0;max-width:560px;font-size:15px;color:var(--muted)}
.why{display:grid;grid-template-columns:repeat(2,1fr);gap:32px;max-width:820px;margin:0 auto}
.why .ic{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;margin-bottom:14px}
.why h3{font-family:var(--fb);font-weight:800;font-size:18px;margin-bottom:6px}.why p{font-size:15px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:26px}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--lime);color:var(--on-lime);font-family:var(--fd);font-weight:600;font-size:20px;margin-bottom:14px}
.step h3{font-family:var(--fb);font-weight:800;font-size:18px;margin-bottom:4px}
.band{background:var(--lime-soft);border-radius:36px;padding:60px 28px;text-align:center;position:relative;overflow:hidden;margin-top:56px}
.band h2{font-size:clamp(28px,4.5vw,44px);line-height:1.08;letter-spacing:-1px;max-width:600px;margin:0 auto 14px}
.band p{font-size:18px;margin:0 auto 26px;max-width:520px}

footer{background:var(--soft);border-top:1px solid var(--hair);padding:56px 0 36px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
footer h4{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:12px;letter-spacing:.3px}
footer ul{list-style:none;display:grid;gap:9px;font-size:15px}footer ul a:hover{color:var(--green)}
footer .d{font-size:15px;color:var(--muted);max-width:300px;margin-top:12px}
.fb{margin-top:34px;padding-top:20px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mb{position:fixed;inset:0;background:rgba(20,39,28,.5);backdrop-filter:blur(4px);display:none;place-items:center;z-index:100;padding:24px}
.mb.on{display:grid}
.m{background:var(--canvas);border-radius:28px;padding:30px;width:100%;max-width:440px;position:relative;max-height:100%;overflow:auto;animation:pop .32s var(--ease)}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}}
.m h3{font-size:28px;letter-spacing:-.5px;padding-right:40px}.m .s{margin:6px 0 20px}
.x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--strong);display:grid;place-items:center;color:var(--ink)}
.fl{margin-bottom:16px}.fl label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
.in{width:100%;font:16px var(--fb);color:var(--ink);background:var(--card);border:1.5px solid var(--hair2);border-radius:16px;padding:12px 16px;min-height:48px}
.in:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:96px;text-align:center;padding:11px 8px;border-radius:16px;border:1.5px solid var(--hair2);font-weight:700;font-size:14px;color:var(--ink);transition:all .2s}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.err{display:none;color:#E8503C;font-size:14px;font-weight:700;margin:-4px 0 12px}.ok{text-align:center;display:none}.ok svg{margin:0 auto 14px}
@media (max-width:900px){.hg,.progs,.price,.why,.steps,.fg{grid-template-columns:1fr}.links{display:none}.vis{aspect-ratio:1/.8}}
@media (max-width:520px){.why{grid-template-columns:1fr}.wrap{padding:0 18px}.tier{padding:26px}.lang .wrap{justify-content:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var L=['ru','kk','en'],H=document.documentElement;
function set(l){
  var k=L.indexOf(l);if(k<0){l='ru';k=0}
  H.lang=l;document.title=T.title[k];
  document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=T[e.dataset.i][k]});
  document.querySelectorAll('[data-ph]').forEach(function(e){e.placeholder=T[e.dataset.ph][k]});
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l)});
  try{localStorage.setItem('bt-lang',l)}catch(e){}
}
var s=null;try{s=localStorage.getItem('bt-lang')}catch(e){}
if(!s){var n=(navigator.language||'ru').slice(0,2);s=n==='kk'?'kk':n==='en'?'en':'ru'}
document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){set(b.dataset.lang)})});
set(s);
var mb=document.getElementById('mb'),f1=document.getElementById('f1'),ok=document.getElementById('ok');
function open(){f1.style.display='';ok.style.display='none';mb.classList.add('on')}
function close(){mb.classList.remove('on')}
document.querySelectorAll('[data-book]').forEach(function(b){b.addEventListener('click',open)});
document.getElementById('mx').addEventListener('click',close);
document.getElementById('ok2').addEventListener('click',close);
mb.addEventListener('click',function(e){if(e.target===mb)close()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
['ag','fm'].forEach(function(id){var g=document.getElementById(id);g.addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;g.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});c.classList.add('on')})});
